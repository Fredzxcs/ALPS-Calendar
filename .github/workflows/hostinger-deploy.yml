name: Hostinger Staging Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Assets
        run: npm run build


      # STEP A: Prepare SSH key for rsync (uses secret SSH_PRIVATE_KEY)
      - name: Setup SSH key for rsync
        if: ${{ success() }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # STEP 1: Mirror repository to staging with rsync (keeps remote .env)
      - name: Mirror via rsync to Staging (delete removed files)
        if: ${{ success() }}
        run: |
          rsync -avz --delete --exclude='.env' -e "ssh -i ~/.ssh/id_rsa -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=yes" ./ ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:domains/alpscalendar.com/public_html/staging/

      # Remove local temporary .env after upload/build for security
      - name: Delete temporary .env
        if: ${{ success() }}
        run: rm -f .env

      # STEP 2: PATAKBUHIN ANG DATABASE UPDATE LIGTAS GAMIT ANG SERVER .ENV
      - name: Run Database Migration on Server
        if: ${{ success() }}
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            cd domains/alpscalendar.com/public_html/staging
            php artisan migrate --force

      # STEP 3: LINISIN ANG LARAVEL CACHE PARA MALABAS ANG LATEST NA CODE AT VIEWS
      - name: Clear Laravel Cache on Staging Server
        if: ${{ success() }}
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            cd domains/alpscalendar.com/public_html/staging
            php artisan optimize:clear

      # STEP 4: Write deployed commit SHA for verification
      - name: Write deployed commit SHA on server
        if: ${{ success() }}
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            cd domains/alpscalendar.com/public_html/staging
            echo "${{ github.sha }}" > deployed_commit.txt
            cat deployed_commit.txt
