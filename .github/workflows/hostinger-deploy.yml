name: Hostinger Production Deploy

on:
  push:
    branches: [main] # Awtomatikong magpapatakbo kapag nag-push ka sa main branch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Assets
        run: npm run build

      # STEP A: I-load ang SSH key para sa rsync at malayuang utos sa server
      - name: Start ssh-agent and add key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # STEP 1: I-mirror ang repository sa TOTOONG public_html (Ligtas ang inyong live .env at staging folder)
      - name: Mirror via rsync to Production (delete removed files)
        if: ${{ success() }}
        run: |
          rsync -avz --delete --exclude='.env' --exclude='.htaccess' --exclude='staging/' -e "ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no" ./ ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:domains/alpscalendar.com/public_html/

      # Burahin ang pansamantalang .env sa GitHub Runner para sa seguridad
      - name: Delete temporary .env
        if: ${{ success() }}
        run: rm -f .env

      # STEP 2: I-MIGRATE ANG MAIN DATABASE GAMIT ANG UMIRIRAL NA LIVE SERVER .ENV
      - name: Run Database Migration on Production Server
        if: ${{ success() }}
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            cd domains/alpscalendar.com/public_html
            php artisan migrate --force

      # STEP 3: REFRESH ANG LARAVEL CACHE NG LIVE SITE PARA LUMABAS ANG UPDATE
      - name: Clear Laravel Cache on Production Server
        if: ${{ success() }}
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            cd domains/alpscalendar.com/public_html
            php artisan optimize:clear

      # STEP 4: Isulat ang deployed commit SHA para sa tracking at verification
      - name: Write deployed commit SHA on production server
        if: ${{ success() }}
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            cd domains/alpscalendar.com/public_html
            echo "${{ github.sha }}" > deployed_commit.txt
            cat deployed_commit.txtname: Hostinger Production Deploy

