name: Hostinger Staging Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Assets
        run: npm run build

      # 🌟 ETO ANG BAGONG DAGDAG: Buburahin ang local .env bago mag-upload 
      # para hindi mapasukan o mabura ang nakalagay na .env sa Hostinger server mo
      - name: Delete temporary .env before upload
        run: rm .env

      # STEP 1: I-UPLOAD ANG LAHAT NG CODE AT BUILT FILES
      - name: Upload All Files to Staging Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "."
          target: "domains/alpscalendar.com/public_html/staging"

      # STEP 2: PATAKBUHIN ANG DATABASE UPDATE LIGTAS GAMIT ANG SERVER .ENV
      - name: Run Database Migration on Server
        if: ${{ success() }}
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            cd domains/alpscalendar.com/public_html/staging
            php artisan migrate --force

      # STEP 3: LINISIN ANG LARAVEL CACHE PARA MALABAS ANG LATEST NA CODE AT VIEWS
      - name: Clear Laravel Cache on Staging Server
        if: ${{ success() }}
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            cd domains/alpscalendar.com/public_html/staging
            php artisan optimize:clear
